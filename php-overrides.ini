; ============================================================
; PHP 8.5 Compatibility Overrides for PrestaShop on Ubuntu 26.04
; Apply to: /etc/php/8.5/apache2/php.ini
; ============================================================

; Fix 1: Disable PCRE JIT to prevent fatal memory allocation
; error in EC2 environments.
pcre.jit = 0

; Fix 2: Suppress PHP 8.5 strict null-type notices that corrupt
; PrestaShop's HTML template output in the browser.
error_reporting = E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED

; Keep errors logged to file rather than sent to browser output.
display_errors = Off
log_errors     = On
error_log      = /var/log/php_errors.log
