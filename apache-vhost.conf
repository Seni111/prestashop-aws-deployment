# ============================================================
# Apache VirtualHost for PrestaShop
# Place in: /etc/apache2/sites-available/prestashop.conf
# Enable with: sudo a2ensite prestashop.conf
# ============================================================

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Required for PrestaShop's .htaccess-based routing
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/prestashop-error.log
    CustomLog ${APACHE_LOG_DIR}/prestashop-access.log combined
</VirtualHost>
